name: "[VCF Content Factory] Synology Storage Pool Status Not Normal"
adapter_kind: synology_diskstation
resource_kind: SynologyStoragePool
severity: CRITICAL
wait_cycles: 3
cancel_cycles: 3

condition:
  type: property
  key: Configuration|status
  operator: NOT_EQ
  value: "normal"

description: >
  Triggers when a storage pool status (Configuration|status) is anything other than normal, for example degraded or crashed.
