name: "[VCF Content Factory] Synology Volume Failed"
adapter_kind: synology_diskstation
resource_kind: SynologyVolume
severity: CRITICAL
wait_cycles: 3
cancel_cycles: 3

condition:
  type: property
  key: Configuration|status
  operator: REGEX
  value: "^(degrade|crashed|deverr|ro)$"

description: >
  Triggers when a volume status (Configuration|status) is one of the failure values DSM defines: degrade, crashed, deverr or ro (read-only).
