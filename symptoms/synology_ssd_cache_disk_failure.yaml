name: "[VCF Content Factory] Synology SSD Cache Disk Failure"
adapter_kind: synology_diskstation
resource_kind: SynologySsdCache
severity: CRITICAL
wait_cycles: 3
cancel_cycles: 3

condition:
  type: property
  key: Hardware|disk_failure_count
  operator: NOT_EQ
  value: "0"

description: >
  Triggers when an SSD cache reports a nonzero failed disk count (Hardware|disk_failure_count).
