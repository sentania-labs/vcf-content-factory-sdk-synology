name: "[VCF Content Factory] Synology Volume Not Healthy"
description: >
  Fires when a Synology volume reports a failure status (degrade, crashed, deverr or ro). Cancels when the status clears.
adapter_kind: synology_diskstation
resource_kind: SynologyVolume
type: 18
sub_type: 18
wait_cycles: 1
cancel_cycles: 1
criticality: CRITICAL
impact:
  badge: HEALTH
symptom_sets:
  operator: ALL
  sets:
    - defined_on: SELF
      operator: ALL
      symptoms:
        - name: "[VCF Content Factory] Synology Volume Failed"
recommendations:
  - name: "[VCF Content Factory] Synology Repair Degraded Storage"
    priority: 1
