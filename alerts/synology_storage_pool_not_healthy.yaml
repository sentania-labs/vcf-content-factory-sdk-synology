name: "[VCF Content Factory] Synology Storage Pool Not Healthy"
description: >
  Fires when a Synology storage pool reports a failure status (degrade, crashed or deverr). Cancels when the status clears.
adapter_kind: synology_diskstation
resource_kind: SynologyStoragePool
type: 18
sub_type: 18
wait_cycles: 1
cancel_cycles: 1
criticality: CRITICAL
impact:
  badge: HEALTH
symptom_sets:
  operator: ALL
  sets:
    - defined_on: SELF
      operator: ALL
      symptoms:
        - name: "[VCF Content Factory] Synology Storage Pool Failed"
recommendations:
  - name: "[VCF Content Factory] Synology Repair Degraded Storage"
    priority: 1
