name: "[VCF Content Factory] Synology UPS Low Battery"
adapter_kind: synology_diskstation
resource_kind: SynologyUps
severity: CRITICAL
wait_cycles: 3
cancel_cycles: 3

condition:
  type: property
  key: Status|status
  operator: CONTAINS
  value: "LB"

description: >
  Triggers when the UPS NUT status (Status|status) contains LB (low battery). Begin graceful shutdown.
