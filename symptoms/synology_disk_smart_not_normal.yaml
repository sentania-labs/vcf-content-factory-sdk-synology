name: "[VCF Content Factory] Synology Disk SMART Status Not Normal"
adapter_kind: synology_diskstation
resource_kind: SynologyDisk
severity: CRITICAL
wait_cycles: 3
cancel_cycles: 3

condition:
  type: property
  key: Health|smart_status
  operator: NOT_EQ
  value: "normal"

description: >
  Triggers when a disk's SMART status (Health|smart_status) is anything other than normal.
