name: "[VCF Content Factory] Synology Respond To UPS Power Event"
description: |
  The UPS attached to the DiskStation reports usb_ups_status_battery (running on battery) or low_batt (battery low). Utility power is likely lost or unstable.

  Check mains power at the UPS and restore it if possible. Open DSM Control Panel, go to Hardware and Power, then UPS, and confirm the UPS is detected and the battery charge.

  If the battery is low, the DiskStation will shut down safely at the configured threshold. Shut down dependent workloads that use this NAS first, such as VMs on iSCSI or NFS datastores. If the UPS runs on battery often, test or replace its battery.
adapter_kind: synology_diskstation
