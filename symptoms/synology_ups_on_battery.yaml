name: "[VCF Content Factory] Synology UPS On Battery"
adapter_kind: synology_diskstation
resource_kind: SynologyUps
severity: WARNING
wait_cycles: 3
cancel_cycles: 3

condition:
  type: property
  key: Status|status
  operator: EQ
  value: "usb_ups_status_battery"

description: >
  Triggers when the UPS status (Status|status) equals usb_ups_status_battery, DSM's key for running on battery after mains power was lost.
