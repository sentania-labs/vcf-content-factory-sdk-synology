name: "VCF Content Factory Synology DiskStation"
version: "1.0.0"
build_number: 27
adapter_kind: "synology_diskstation"
tier: 2
description: >
  Monitors Synology DiskStation NAS devices via the DSM Web API.
  Discovers storage pools, volumes, disks, iSCSI LUNs, NFS exports,
  and UPS. Collects capacity, performance, and health metrics.
  Cross-endpoint joining merges IO metrics onto the correct storage
  objects (Tier 2 trigger: complex data-model joining). Framework v2
  (SPI: VcfCfTester/VcfCfCollector over AdapterBase; collect-path
  discovery via enumerateResources + discoverOnCollect, §22).
entry_class: "com.vcfcf.adapters.synology.SynologyAdapter"
released: true
cross_mp_edges:
  - parent: "VMWARE Datastore"
    child: "SynologyIscsiLun"
    direction: parent_foreign
    foreign_adapter_kind: VMWARE
    description: >
      iSCSI LUN attached under the backing VMWARE Datastore (matched by
      computed VMFS extent NAA path); additive parentForeign edge via
      Suite API, resolved against real inventory only (no phantom
      Datastore minted when no match exists). One path can back N
      datastores (one per vCenter view) — bound to every copy.
  - parent: "VMWARE Datastore"
    child: "SynologyNfsExport"
    direction: parent_foreign
    foreign_adapter_kind: VMWARE
    description: >
      NFS export attached under the backing VMWARE Datastore (matched by
      computed <nas_ip>/<vol_path>/<share> path per connected NAS
      interface); additive parentForeign edge via Suite API, deduped so a
      single Datastore never gets the same export as a duplicate child.
