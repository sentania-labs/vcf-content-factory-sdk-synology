name: "[VCF Content Factory] Synology UPS Low Battery"
adapter_kind: synology_diskstation
resource_kind: SynologyUps
severity: CRITICAL
wait_cycles: 3
cancel_cycles: 3

condition:
  type: property
  key: Status|status
  operator: EQ
  value: "usb_ups_status_low_batt"

description: >
  Triggers when the UPS status (Status|status) equals usb_ups_status_low_batt, DSM's key for a low battery. Begin graceful shutdown.
