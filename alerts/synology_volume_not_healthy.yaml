  Fires when a Synology volume reports a status other than normal. Cancels when the status returns to normal.
adapter_kind: synology_diskstation
resource_kind: SynologyVolume
type: 18
sub_type: 18
wait_cycles: 1
cancel_cycles: 1
criticality: CRITICAL
impact:
  badge: HEALTH
symptom_sets:
  operator: ALL
  sets:
    - defined_on: SELF
      operator: ALL
      symptoms:
        - name: "[VCF Content Factory] Synology Volume Status Not Normal"
recommendations:
